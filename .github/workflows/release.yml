name: Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build (Windows)
        run: flutter build windows --release

      - name: Package Windows build
        run: |
          mkdir -p release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release\posti-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: posti-windows-x64
          path: release/posti-windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build (macOS)
        run: flutter build macos --release

      - name: Package macOS build
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/posti.app release/posti-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: posti-macos
          path: release/posti-macos.zip

  create-release:
    name: Create GitHub Release and attach artifacts
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: posti-windows-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: posti-macos

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.sha }}
          release_name: Release ${{ github.sha }}
          body: "Automated release for commit ${{ github.sha }}"
          draft: false
          prerelease: false

      - name: Upload Windows asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./posti-windows-x64.zip
          asset_name: posti-windows-x64.zip
          asset_content_type: application/zip

      - name: Upload macOS asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./posti-macos.zip
          asset_name: posti-macos.zip
          asset_content_type: application/zip
