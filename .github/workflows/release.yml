name: Build & Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build (Windows)
        run: flutter build windows --release

      - name: Package Windows build
        run: |
          mkdir -p release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release\posti-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: posti-windows-x64
          path: release/posti-windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build (macOS)
        run: flutter build macos --release

      - name: Package macOS build
        run: |
          mkdir -p release
          APP_NAME="Posti"
          # The app bundle name may use the capitalized project name
          if [ -d "build/macos/Build/Products/Release/${APP_NAME}.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/${APP_NAME}.app" release/posti-macos.zip
          elif [ -d "build/macos/Build/Products/Release/posti.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/posti.app" release/posti-macos.zip
          else
            echo "Could not find .app bundle" && ls -la build/macos/Build/Products/Release/ && exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: posti-macos
          path: release/posti-macos.zip

  create-release:
    name: Create GitHub Release and attach artifacts
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: echo "tag=v1.0.0-$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: posti-windows-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: posti-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: "Automated release for commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: |
            posti-windows-x64.zip
            posti-macos.zip
